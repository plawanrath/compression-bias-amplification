models:
  - name: "llama3.1-8b-instruct"
    hf_path: "meta-llama/Llama-3.1-8B-Instruct"
  - name: "mistral-7b-instruct-v0.3"
    hf_path: "mistralai/Mistral-7B-Instruct-v0.3"
  - name: "phi-3.5-mini-instruct"
    hf_path: "microsoft/Phi-3.5-mini-instruct"

quantization:
  bit_widths: [16, 8, 6, 4, 3]
  group_size: 64
  models_dir: "./models"

dataset:
  name: "heegyu/bbq"
  bias_categories: ["Age", "Gender_identity", "Race_ethnicity", "Religion", "SES"]
  condition: "ambiguous"
  output_path: "./data/processed/bbq_ambiguous.jsonl"

inference:
  temperature: 0.3
  max_tokens: 5
  num_seeds: 5
  seeds: [42, 123, 456, 789, 1024]

baseline_filter:
  # Only keep items where BF16 SRS falls in this range
  min_srs: 0.45
  max_srs: 0.70

output:
  raw_results_dir: "./results/raw"
  aggregated_dir: "./results/aggregated"
  figures_dir: "./results/figures"
